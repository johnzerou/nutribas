<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="citrusGrad" x1="85%" y1="15%" x2="15%" y2="85%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="45%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="citrusGradRing" x1="90%" y1="10%" x2="10%" y2="90%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
  </defs>
  <!-- Outer Ring -->
  <circle cx="50" cy="50" r="46" fill="url(#citrusGradRing)" />
  <circle cx="50" cy="50" r="41" fill="#ffffff" />
  <!-- Center Citrus Circle -->
  <circle cx="50" cy="50" r="37.5" fill="url(#citrusGrad)" />
  <!-- Citrus Slice Separators -->
  <line x1="50" y1="12.5" x2="50" y2="87.5" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" />
  <line x1="17.5" y1="31.25" x2="82.5" y2="68.75" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" />
  <line x1="17.5" y1="68.75" x2="82.5" y2="31.25" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" />
  <!-- Center core dot -->
  <circle cx="50" cy="50" r="3.8" fill="#ffffff" />
</svg>